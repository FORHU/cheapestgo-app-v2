name: Deploy Dev

# FORHU/cheapest-go-app → the shared dev host (ap-southeast-1).
#
# One EC2 instance runs every project's dev environment. This workflow owns
# only its own container; it cannot touch another project's, and the deploy
# role cannot reach any host but this one.
#
# BEFORE THE FIRST RUN
#   1. Repository variable:
#        AWS_DEV_DEPLOY_ROLE_ARN = arn:aws:iam::617163942417:role/forhu-deploy
#      A new name on purpose: AWS_DEPLOY_ROLE_ARN already points at production
#      in several repos, and in gate-closes-api it switches the deploy target.
#   2. Check APP_PORT against this repo's Dockerfile — it is the port the
#      process listens on inside the container. HOST_PORT is allocated per
#      project and must not change; see /etc/caddy/sites/00-PORTS.md.
#   3. Put this project's own secrets in the `dev` environment, and list them
#      in the "Publish project env" step. DATABASE_URL, REDIS_URL and
#      RABBITMQ_URL come from the host — do NOT set them here.

on:
  push: 
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        # Which deployment this run targets. Everything that differs between them —
        # instance, ports, container names, SSM path — is read from that GitHub
        # environment's variables rather than hardcoded here, so one workflow serves both
        # and neither can be changed by editing the other's values.
        description: "Target environment"
        type: choice
        options: [dev, production]
        default: dev
      ref:
        # No default: this project deploys from `staging`, not the default branch,
        # and a hardcoded value fetches a branch that may not exist, failing in
        # checkout before anything is built. Blank falls back to github.ref_name.
        description: "Branch, tag or SHA to deploy (use: staging)"
        required: false
  # Uncomment once a dev branch exists and the team wants push-to-deploy.
  # push:
  #   branches: [dev]

concurrency:
  # Per environment: a dev deploy and a production deploy touch different hosts and
  # must not queue behind or cancel one another.
  group: forhu-cheapestgo-app-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

# Only what is the same wherever this deploys. Anything that differs by environment is
# resolved in the "Resolve target" step below, from that environment's variables.
#
# No SHARED_ENV: app-v2 is a frontend. It talks to api-v2 over HTTP and touches no
# database, Redis or RabbitMQ, so handing it the project credentials file would spread a
# Postgres URL for no reason.
env:
  AWS_REGION: ap-southeast-1
  ACCOUNT_ID: "617163942417"
  ECR_REPOSITORY: cheapestgo-v2-app
  APP_PORT: "3002"

jobs:
  deploy:
    name: Build and deploy (cheapestgo ${{ inputs.environment || 'dev' }})
    # The runner's architecture must match the target host's. An image built for the
    # wrong one pulls cleanly and then dies with "exec format error", and cross-building
    # under QEMU is not the answer — Node builds take hours and look hung.
    #
    # dev (forhu-dev-app) is a t4g.large: Graviton, arm64.
    # production (forhu-prod-cheapestGo) is a t3.micro: Intel, x86_64.
    #
    # Keep this in step with `platform` in the Resolve target step below. If production
    # ever moves to Graviton, both change together.
    runs-on: ${{ inputs.environment == 'production' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    # "dev" is the context, not the environment's name — dev secrets and variables live on
    # the `staging` environment. Production maps to its own.
    environment: ${{ inputs.environment == 'production' && 'production' || 'staging' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Production sets AWS_DEPLOY_ROLE_ARN on its own environment. forhu-deploy, the dev
          # role, can only SendCommand to the dev host and only PutParameter under
          # /forhu-dev/* — against production it fails on the instance ARN, after the build.
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEV_DEPLOY_ROLE_ARN || 'arn:aws:iam::617163942417:role/forhu-deploy' }}
          aws-region: ${{ env.AWS_REGION }}

      # Everything that differs between dev and production, in one place.
      #
      # Dev keeps working values as defaults so nothing has to be configured to deploy it.
      # Production has none: a missing production variable aborts rather than falling back,
      # because the fallback would deploy production code onto the dev instance and report
      # success doing it.
      - name: Resolve target
        id: cfg
        env:
          TARGET:            ${{ inputs.environment || 'dev' }}
          V_INSTANCE_ID:     ${{ vars.INSTANCE_ID }}
          V_NETWORK:         ${{ vars.DOCKER_NETWORK }}
          V_CONTAINER:       ${{ vars.CONTAINER_NAME }}
          V_STAFF_CONTAINER: ${{ vars.STAFF_CONTAINER_NAME }}
          V_HOST_PORT:       ${{ vars.HOST_PORT }}
          V_STAFF_HOST_PORT: ${{ vars.STAFF_HOST_PORT }}
          V_ENV_PARAM:       ${{ vars.ENV_PARAM }}
          V_MERGED_ENV:      ${{ vars.MERGED_ENV }}
        run: |
          set -euo pipefail

          if [ "$TARGET" = "production" ]; then
            missing=""
            for v in V_INSTANCE_ID V_NETWORK V_CONTAINER V_STAFF_CONTAINER \
                     V_HOST_PORT V_STAFF_HOST_PORT V_ENV_PARAM V_MERGED_ENV; do
              [ -n "${!v:-}" ] || missing="$missing ${v#V_}"
            done
            if [ -n "$missing" ]; then
              echo "::error::production environment is missing:$missing"
              echo "Set them as variables on the 'production' environment, then re-run." >&2
              exit 1
            fi
          fi

          out() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

          # The tag prefix keeps a dev image from ever being mistaken for, or overwriting,
          # a production one in the same ECR repository.
          [ "$TARGET" = "production" ] && out tag_prefix prod || out tag_prefix dev

          # The dev host is Graviton; the production box is x86_64 (t3 family). One
          # image cannot serve both: the wrong arch pulls cleanly and then dies with
          # "exec format error", which reads as a crash loop rather than a build fault.
          [ "$TARGET" = "production" ] && out platform linux/amd64 || out platform linux/arm64

          out instance_id     "${V_INSTANCE_ID:-i-0f95a93145ea25e7a}"
          out network         "${V_NETWORK:-forhu-dev}"
          out container       "${V_CONTAINER:-cheapestgo-v2-app}"
          # The staff host runs the same image as a second container, so a storefront
          # deploy or crash-loop does not take the support desk down with it (ADR-0006).
          # 4043 is the next free port in this project's dev block — see
          # /etc/caddy/sites/00-PORTS.md: 4040 web, 4041 api, 4042 the AirangGo brand.
          out staff_container "${V_STAFF_CONTAINER:-cheapestgo-v2-staff}"
          out host_port       "${V_HOST_PORT:-4040}"
          out staff_host_port "${V_STAFF_HOST_PORT:-4043}"
          out env_param       "${V_ENV_PARAM:-/forhu-dev/cheapestgo-v2-app/env}"
          out merged_env      "${V_MERGED_ENV:-/opt/forhu-dev/cheapestgo-v2-app.env}"

          echo "Target: $TARGET"

      - name: Resolve image tag
        id: tag
        run: |
          echo "tag=${{ steps.cfg.outputs.tag_prefix }}-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "registry=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ steps.tag.outputs.registry }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ steps.cfg.outputs.platform }}
          provenance: false
          # Every variable this app reads is NEXT_PUBLIC_*, which `next build`
          # inlines into the client bundle, so they must be build args. Set at
          # runtime instead, the browser falls back to next.config.ts's default
          # of http://localhost:4000/api/v2 and every call fails from the
          # tester's machine with nothing in any server log.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || vars.DEV_NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || vars.DEV_NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_BRAND_NAME=${{ vars.NEXT_PUBLIC_BRAND_NAME }}
            NEXT_PUBLIC_LOCALE=${{ vars.NEXT_PUBLIC_LOCALE }}
            NEXT_PUBLIC_MAPBOX_TOKEN=${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
            NEXT_PUBLIC_STAFF_HOST=${{ vars.NEXT_PUBLIC_STAFF_HOST || vars.DEV_NEXT_PUBLIC_STAFF_HOST }}
          tags: ${{ steps.tag.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}

      # This project's own secrets only. Anything unset is omitted rather than
      # written empty: an empty value looks configured and silently disables
      # whatever reads it, which is how three features were found dead on the
      # UK stack.
      - name: Publish project env to Parameter Store
        run: |
          set -euo pipefail
          umask 077

          # Nothing from GitHub at runtime: every NEXT_PUBLIC_* value was
          # already inlined into the bundle by the build above, and PORT and
          # HOSTNAME come from the Dockerfile. This parameter exists so the
          # deploy has something to merge, and as the place for a genuine
          # runtime variable if one ever appears.
          printf 'NODE_ENV=production\n' > env.tmp

          aws ssm put-parameter \
            --name "${{ steps.cfg.outputs.env_param }}" \
            --type SecureString --overwrite \
            --value "file://env.tmp" \
            --region "${{ env.AWS_REGION }}" > /dev/null
          rm -f env.tmp

      - name: Deploy via SSM
        id: send
        env:
          REGISTRY: ${{ steps.tag.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${{ env.ECR_REPOSITORY }}:${TAG}"

          COMMANDS=(
            "set -euo pipefail"
            ": > ${{ steps.cfg.outputs.merged_env }}"
            "aws ssm get-parameter --name ${{ steps.cfg.outputs.env_param }} --with-decryption --region ${{ env.AWS_REGION }} --query Parameter.Value --output text >> ${{ steps.cfg.outputs.merged_env }}"
            "chmod 600 ${{ steps.cfg.outputs.merged_env }}"
            "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${REGISTRY}"
            "docker container prune -f || true"
            "docker image prune -af || true"
            "docker pull --platform ${{ steps.cfg.outputs.platform }} ${IMAGE}"
            "docker rm -f ${{ steps.cfg.outputs.container }} 2>/dev/null || true"
            "docker run -d --name ${{ steps.cfg.outputs.container }} --restart unless-stopped --platform ${{ steps.cfg.outputs.platform }} --network ${{ steps.cfg.outputs.network }} --env-file ${{ steps.cfg.outputs.merged_env }} -p 127.0.0.1:${{ steps.cfg.outputs.host_port }}:${{ env.APP_PORT }} ${IMAGE}"
            "docker rm -f ${{ steps.cfg.outputs.staff_container }} 2>/dev/null || true"
            # Same image, same env — the only difference is which hostname Caddy sends it.
            # Separate so the support desk survives a storefront restart.
            "docker run -d --name ${{ steps.cfg.outputs.staff_container }} --restart unless-stopped --platform ${{ steps.cfg.outputs.platform }} --network ${{ steps.cfg.outputs.network }} --env-file ${{ steps.cfg.outputs.merged_env }} -p 127.0.0.1:${{ steps.cfg.outputs.staff_host_port }}:${{ env.APP_PORT }} ${IMAGE}"
          )

          # jq builds the JSON, so a quote inside any command cannot break it.
          PARAMS=$(printf '%s\n' "${COMMANDS[@]}" | jq -R . | jq -sc '{commands: .}')

          CMD_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --instance-ids "${{ steps.cfg.outputs.instance_id }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ steps.cfg.outputs.container }} ${TAG}" \
            --timeout-seconds 900 \
            --parameters "${PARAMS}" \
            --query Command.CommandId --output text)

          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for the deploy
        run: |
          set -uo pipefail
          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --region "${{ env.AWS_REGION }}" \
              --command-id "${{ steps.send.outputs.command_id }}" \
              --instance-id "${{ steps.cfg.outputs.instance_id }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ steps.cfg.outputs.instance_id }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text

          [ "$STATUS" = "Success" ] || { echo "::error::deploy $STATUS"; exit 1; }
